experiment:
  output_dir: logs/late_fusion
  seed: 42

llm:
  llm_root: /home/ilay.kamai/work/.llama
  llm_model: Llama3.1-8B
  llm_path: null
  llm_precision: fp16

data:
  json_file: /home/ilay.kamai/work/TalkingLatents/data/dataset/stellar_qa_hybrid.json
  features_file: None
  tokenizer_path: /home/ilay.kamai/work/.llama/Llama3.1-8B/tokenizer.model
  batch_size: 2
  num_workers: 2
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_state: 42
  max_length: 128
  cache_dir: cache/late_fusion
  dataset_kwargs:
    # followup_json_file is likely not needed for diverse loader as it has its own logic, but keeping if it uses base args
    # followup_mode: mixed
  # Cycle-fusion follow-up controls (optional)
  use_followups: true
  followup_prob: 1.0
  max_followups: 1
  followup_seed: 12345
  append_answer_prompt: true

model:
  config_path: configs/late_fusion_model.json
  overrides:
    freeze_llm: true
    freeze_spectral: true
    # Enable CE supervision of LLM prefix generated by Perceiver
    enable_cycle_ce: true
    loss_weights:
      reconstruction: 1.0
      contrastive: 0.5
      ce: 1.0
      param_regression: 1.0
    modality_dropout:
      enabled: true
      drop_text_prob: 0.3
      drop_spectra_prob: 0.3

spectral_model:
  enabled: true

training:
  distributed: True
  num_epochs: 1000
  optimizer:
    type: adamw
    lr: 0.0002
    weight_decay: 0.001
    betas: [0.9, 0.999]
  scheduler:
    type: cosine
    t_max: 2
    min_lr: 1.0e-6
  accumulation_steps: 1
  grad_clip: true
  max_grad_norm: 1.0
  use_amp: true
  log_losses_every: 100
  best_metric: loss
  early_stopping: null
  save_full_every_epoch: true
  # Cycle-fusion CE warmup schedule
  ce:
    enable: true
    target_weight: 1.0
    warmup_epochs: 0
    start_epoch: 0
